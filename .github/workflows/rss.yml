
name: Veranstaltungen RSS

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: rss-pages
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Abhängigkeiten installieren
        run: pip install -r requirements.txt

      - name: RSS-Datei generieren
        run: python generate_feed.py

      - name: GitHub Pages einrichten
        uses: actions/configure-pages@v5

      - name: RSS-Datei hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: RSS-Datei veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
