
name: Veranstaltungen RSS

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: rss-pages
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Repository laden
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Abhängigkeiten installieren
        run: pip install -r requirements.txt

      - name: RSS-Datei generieren
        run: python generate_feed.py

      - name: Veranstaltungsstatus speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add events_state.json
          if ! git diff --cached --quiet; then
            git commit -m "Update RSS event state"
            git push
          fi

      - name: GitHub Pages einrichten
        uses: actions/configure-pages@v5

      - name: RSS-Datei hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: RSS-Datei veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4

